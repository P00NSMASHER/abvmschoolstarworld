name: ABVM Calendar visual acceptance

on:
  pull_request:
    paths:
      - 'pages/app.js'
      - 'pages/design-polish.css'
      - 'pages/index.html'
      - 'pages/styles.css'
      - 'pages/sw.js'
      - 'tests/calendar-premium.spec.mjs'
      - 'tests/visual-refinement.spec.mjs'
      - 'tests/design-polish.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/calendar-visual-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-calendar-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:runtime
      - run: npx playwright install --with-deps chromium webkit
      - name: Render Month and Week in Chromium and iPhone WebKit
        run: npx playwright test tests/calendar-premium.spec.mjs --project=mobile --project=iphone-webkit --workers=1 --retries=0
      - name: Downloadable browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-calendar-visual-${{ github.run_id }}
          path: |
            test-results/**/calendar-*.png
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
            playwright-report
          retention-days: 14
          if-no-files-found: ignore
