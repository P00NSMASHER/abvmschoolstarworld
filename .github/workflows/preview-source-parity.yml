name: ABVM premium preview source parity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-preview-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-parity:
    # Review lanes are stable namespaces; do not keep a dated PR allowlist.
    # Source-changing intake/fix PRs retain their separate source/provenance QA.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/') ||
      startsWith(github.head_ref, 'integration/') || startsWith(github.base_ref, 'integration/') ||
      startsWith(github.head_ref, 'schoolwork/') || startsWith(github.base_ref, 'schoolwork/') ||
      startsWith(github.head_ref, 'ux/calendar-') || startsWith(github.base_ref, 'ux/calendar-') ||
      startsWith(github.head_ref, 'design/calendar-') || startsWith(github.base_ref, 'design/calendar-') ||
      startsWith(github.head_ref, 'qa/') || startsWith(github.base_ref, 'qa/') ||
      startsWith(github.head_ref, 'curriculum-candidate-') || startsWith(github.base_ref, 'curriculum-candidate-')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact preview head (not auto-merge artifact)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch latest main for source comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Compare all authoritative school sources and teacher-check clocks
        env:
          ABVM_MAIN_REF: refs/remotes/origin/main
          ABVM_PREVIEW_REF: HEAD
        run: node scripts/assert-release-preview-parity.mjs
      - name: Confirm production stays unchanged
        run: echo "Read-only parity gate completed; no production release."
