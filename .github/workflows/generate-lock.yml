name: Generate dependency lock

on:
  push:
    branches:
      - hardening/steps2-12
    paths:
      - package.json
      - .github/workflows/generate-lock.yml

permissions:
  contents: write

concurrency:
  group: abvm-generate-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/steps2-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- package-lock.json)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generate locked dependency graph"
          git push
