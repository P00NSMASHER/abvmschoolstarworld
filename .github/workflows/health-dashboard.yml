name: ABVM Operational Health Dashboard

on:
  schedule:
    # 7:02 PM Eastern is 23:02 UTC in EDT and 00:02 UTC in EST.
    - cron: '2 0,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: abvm-operational-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Gate to 7:02 PM Eastern
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +'%H:%M')" = "19:02" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: 22

      - name: Fetch recent workflow history
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs?per_page=100" > /tmp/abvm-runs.json

      - name: Build operational health report
        if: steps.gate.outputs.proceed == 'true'
        env:
          WORKFLOW_RUNS_FILE: /tmp/abvm-runs.json
        run: node scripts/build-health-report.mjs

      - name: Publish health summary
        if: always() && steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          if [ -f health-output/abvm-health-summary.md ]; then
            cat health-output/abvm-health-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload health dashboard artifact
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: abvm-operational-health
          path: health-output/
          if-no-files-found: error
          retention-days: 30
