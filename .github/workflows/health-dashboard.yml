name: ABVM Operational Health Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/health-dashboard.yml'
      - 'scripts/build-health-report.mjs'
      - 'scripts/health-evidence.mjs'
      - 'scripts/fetch-health-history.mjs'
      - 'scripts/refresh-stage-health.mjs'
      - 'tests/refresh-stage-health.test.mjs'
      - 'tests/health-dashboard-config.test.mjs'
      - 'tests/health-evidence.test.mjs'
  workflow_run:
    workflows:
      - Monitor ABVM refresh health
    types: [completed]
  schedule:
    - cron: '43 16 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: abvm-operational-health
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    name: build operational health dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch recent workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-health-history.mjs
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > open-pulls.json

      - name: Read main branch protection status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/main" > main-branch-status.json; then
            echo "::warning::Could not verify main branch protection."
            printf '%s\n' '{"name":"main","protected":null}' > main-branch-status.json
          fi

      - name: Build health dashboard
        env:
          WORKFLOW_RUNS_FILE: workflow-runs.json
          REFRESH_JOBS_FILE: refresh-jobs.json
          REFRESH_STAGE_JOBS_FILE: refresh-stage-jobs.json
          OPEN_PULLS_FILE: open-pulls.json
          HOMEWORK_PUBLICATIONS_FILE: homework-publications.json
          MAIN_BRANCH_FILE: main-branch-status.json
        run: npm run health:report

      - name: Publish dashboard to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f health-output/abvm-health-summary.md ]]; then
            cat health-output/abvm-health-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ABVM health report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload machine-readable health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-operational-health-${{ github.run_id }}
          path: health-output/
          if-no-files-found: error
          retention-days: 30
