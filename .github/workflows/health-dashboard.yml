name: ABVM Operational Health Dashboard

on:
  workflow_run:
    workflows:
      - ABVM App QA
      - Deploy ABVM to GitHub Pages
      - Refresh ABVM teacher pages
      - Monitor ABVM refresh health
    types: [completed]
  schedule:
    - cron: '43 16 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: abvm-operational-health
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    name: build operational health dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch recent workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > workflow-runs.json

      - name: Build health dashboard
        env:
          WORKFLOW_RUNS_FILE: workflow-runs.json
        run: npm run health:report

      - name: Publish dashboard to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f health-output/abvm-health-summary.md ]]; then
            cat health-output/abvm-health-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ABVM health report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload machine-readable health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-operational-health-${{ github.run_id }}
          path: health-output/
          if-no-files-found: error
          retention-days: 30
