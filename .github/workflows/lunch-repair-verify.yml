name: Verify ABVM lunch repair
on:
  push:
    branches: [fix/current-week-lunch-source]
    paths: ['.repair/lunch-repair.py', '.repair/lunch-fixture.py', '.github/workflows/lunch-repair-verify.yml']
permissions:
  contents: write
concurrency:
  group: abvm-lunch-repair-branch
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/current-week-lunch-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-anchor lunch integration fixes and dated fixture
        run: |
          python3 .repair/lunch-repair.py
          python3 .repair/lunch-fixture.py
      - name: Probe actual public API and validate reviewed source evidence
        run: |
          mkdir -p /tmp/lunch-proof
          node --input-type=module <<'JS'
          import {fetchLunchFeed,LUNCH_FEED_URL} from './scripts/lunch-publication.mjs';
          import {writeFileSync} from 'node:fs';
          const started=Date.now();
          const feed=await fetchLunchFeed();
          console.log(JSON.stringify({url:LUNCH_FEED_URL,elapsedMs:Date.now()-started,feed},null,2));
          if(feed.retrievalState!=='verified')throw new Error('Bridge source verification did not succeed');
          const repeat=await fetchLunchFeed();
          if(JSON.stringify(feed.lunchMenu)!==JSON.stringify(repeat.lunchMenu)||feed.sourceCheckedAt!==repeat.sourceCheckedAt)throw new Error('Cached source response changed unexpectedly');
          writeFileSync('/tmp/lunch-proof/bridge.json',JSON.stringify(feed,null,2));
          JS
      - name: Refresh all teacher pages and validated lunch publication
        run: node scripts/refresh-teacher-pages.mjs
      - name: Prove repository and lunch health
        run: node scripts/check-refresh-health.mjs --require-today --max-age-hours 1
      - name: Remove one-time repair machinery from the candidate
        run: git rm .repair/lunch-repair.py .repair/lunch-fixture.py .github/workflows/lunch-source-diagnostic.yml .github/workflows/lunch-repair-verify.yml
      - name: Retain candidate source evidence
        run: |
          mkdir -p /tmp/lunch-proof/candidate
          cp -R pages scripts tests .github package.json package-lock.json playwright.config.mjs /tmp/lunch-proof/candidate/
      - name: Install locked QA dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Full static, unit and mobile/desktop regression tests
        shell: bash
        run: |
          set -o pipefail
          npm run qa 2>&1 | tee /tmp/lunch-proof/qa.log
      - name: Commit verified code changes within bot contents permissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/current-week-lunch-source'
          git reset HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/app.js pages/data/study-pack.json scripts/refresh-teacher-pages.mjs scripts/check-refresh-health.mjs scripts/build-health-report.mjs tests/hardening.spec.mjs tests/gold-standard.spec.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Verify and integrate resilient lunch source publication'
            git push origin HEAD:fix/current-week-lunch-source
          fi
          git rev-parse HEAD | tee /tmp/lunch-proof/tested-commit.txt
          git archive --format=tar HEAD | gzip > /tmp/lunch-proof/repo.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abvm-lunch-repair-proof
          path: |
            /tmp/lunch-proof
            playwright-report
            test-results
          retention-days: 7
