name: Study player premium visual acceptance

on:
  pull_request:
    paths:
      - 'pages/study-games-materials.css'
      - 'pages/index.html'
      - 'pages/sw.js'
      - 'playwright.config.mjs'
      - 'tests/study-player-premium.spec.mjs'
      - '.github/workflows/study-player-visual-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-study-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  player-render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble-amd64
      options: --ipc=host
    env:
      ABVM_PREINSTALLED_BROWSERS: '1'
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Trust only the mounted Actions workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install checksum-verified jq for recovery contracts
        run: |
          mkdir -p "$RUNNER_TEMP/abvm-bin"
          curl --fail --location --retry 2 --max-time 30 --retry-max-time 90 https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o "$RUNNER_TEMP/abvm-bin/jq"
          echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  $RUNNER_TEMP/abvm-bin/jq" | sha256sum --check
          chmod +x "$RUNNER_TEMP/abvm-bin/jq"
          "$RUNNER_TEMP/abvm-bin/jq" --version
          echo "$RUNNER_TEMP/abvm-bin" >> "$GITHUB_PATH"
      - name: Set up Python for local app server and parser checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact review-head commit
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:runtime
      - name: Cache version-pinned Playwright browsers
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: abvm-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and WebKit with bounded dependency fallback
        run: bash scripts/install-playwright-ci.sh
      - name: Real question, hint, feedback and test-prep states in Chromium and WebKit
        run: npx playwright test tests/study-player-premium.spec.mjs --project=mobile --project=iphone-webkit --workers=1 --retries=0
      - name: Keep downloadable rendered evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abvm-study-player-${{ github.run_id }}
          path: |
            test-results/**/study-player-*.png
            playwright-report
            test-results/**/trace.zip
            test-results/**/test-failed*.png
          retention-days: 14
          if-no-files-found: ignore
