name: Study resources premium visual acceptance

on:
  pull_request:
    paths:
      - 'pages/design-polish.css'
      - 'pages/study-notes-library.mjs'
      - 'pages/study-games-materials-view.mjs'
      - 'pages/study-games-materials.css'
      - 'tests/study-notes-library.spec.mjs'
      - 'tests/helpers/study-notes.mjs'
      - 'pages/index.html'
      - 'pages/sw.js'
      - 'playwright.config.mjs'
      - 'tests/study-tools-premium.spec.mjs'
      - 'tests/consumer-product.spec.mjs'
      - '.github/workflows/study-tools-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-study-tools-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-study-resources:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble-amd64
      options: --ipc=host
    env:
      ABVM_PREINSTALLED_BROWSERS: '1'
    defaults:
      run:
        shell: bash
    timeout-minutes: 16
    steps:
      - name: Trust only the mounted Actions workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install checksum-verified jq for recovery contracts
        run: |
          mkdir -p "$RUNNER_TEMP/abvm-bin"
          curl --fail --location --retry 2 --max-time 30 --retry-max-time 90 https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o "$RUNNER_TEMP/abvm-bin/jq"
          echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  $RUNNER_TEMP/abvm-bin/jq" | sha256sum --check
          chmod +x "$RUNNER_TEMP/abvm-bin/jq"
          "$RUNNER_TEMP/abvm-bin/jq" --version
          echo "$RUNNER_TEMP/abvm-bin" >> "$GITHUB_PATH"
      - name: Set up Python for local app server and parser checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact review-head commit
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:runtime
      - name: Cache version-pinned Playwright browsers
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: abvm-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and WebKit with bounded dependency fallback
        run: bash scripts/install-playwright-ci.sh
      - name: Check new resources and inherited Study components in WebKit and Chromium
        run: npx playwright test tests/study-notes-library.spec.mjs tests/study-tools-premium.spec.mjs tests/study-premium.spec.mjs tests/study-player-premium.spec.mjs --project=mobile --project=iphone-webkit --workers=1 --retries=0
      - name: Preserve independent WebKit Study Tools report and screenshots
        shell: bash
        run: |
          set -euo pipefail
          test -d playwright-report
          mv playwright-report playwright-report-study-tools
          if [ -d test-results ]; then mv test-results test-results-study-tools; fi
          # Two engines: prep first/full, notes, history and tablet evidence.
          screenshot_count=$(find playwright-report-study-tools/data -type f -name '*.png' | wc -l)
          test "$screenshot_count" -ge 8
      - name: Enforce above-the-fold Test Prep actions with real phone chrome
        run: npx playwright test tests/consumer-product.spec.mjs --grep 'phone chrome leaves subjects and Test Prep actions reachable' --project=mobile --project=desktop --workers=1 --retries=0
      - name: Downloadable phone and iPad screenshots with error traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-study-tools-${{ github.run_id }}
          path: |
            test-results/**/study-tools-*.png
            test-results/**/test-failed*.png
            test-results/**/trace.zip
            playwright-report
            playwright-report-study-tools
            test-results-study-tools/**/study-tools-*.png
            test-results-study-tools/**/notes-*.png
            test-results-study-tools/**/trace.zip
          retention-days: 14
          if-no-files-found: ignore
