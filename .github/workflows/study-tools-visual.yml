name: Study resources premium visual acceptance

on:
  pull_request:
    paths:
      - 'pages/design-polish.css'
      - 'pages/index.html'
      - 'pages/sw.js'
      - 'playwright.config.mjs'
      - 'tests/study-tools-premium.spec.mjs'
      - '.github/workflows/study-tools-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-study-tools-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-study-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:runtime
      - run: npx playwright install --with-deps chromium webkit
      - name: Check new resources and inherited Study components in WebKit and Chromium
        run: npx playwright test tests/study-tools-premium.spec.mjs tests/study-premium.spec.mjs tests/study-player-premium.spec.mjs --project=mobile --project=iphone-webkit --workers=1 --retries=0
      - name: Downloadable phone and iPad screenshots with error traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-study-tools-${{ github.run_id }}
          path: |
            test-results/**/study-tools-*.png
            test-results/**/test-failed*.png
            test-results/**/trace.zip
            playwright-report
          retention-days: 14
          if-no-files-found: ignore
