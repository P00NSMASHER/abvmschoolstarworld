name: Refresh current ABVM homework

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-current-homework.mjs'
      - 'scripts/homework-posting.mjs'
      - 'scripts/teacher-page-parsers.mjs'
      - 'scripts/source-freshness-recovery.mjs'
      - '.github/workflows/daily-source-recovery.yml'
      - '.github/workflows/refresh-current-homework.yml'
  schedule:
    # Two off-peak attempts per hour reduce the update window when GitHub drops
    # a delayed scheduled event under platform load.
    - cron: '7,37 6-23 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-homework-source
  cancel-in-progress: false
  queue: max

jobs:
  homework:
    # One mutation/publication at a time; job scope avoids parent-child deadlock.
    concurrency:
      group: abvm-verified-school-state
      cancel-in-progress: false
      queue: max
    name: Verify Homework independently of study-curriculum promotion
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      release_sha: ${{ steps.publish.outputs.release_sha }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test teacher parser and Homework source publication
        run: |
          node --check scripts/refresh-current-homework.mjs
          node --test tests/teacher-page-parsers.test.mjs tests/homework-posting.test.mjs tests/homework-feed.test.mjs
      - name: Fetch and verify public teacher Homework posting
        run: node scripts/refresh-current-homework.mjs
      - name: Commit only independently verified homework updates
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pages/data/homework-current.json; then
            echo "Homework was verified; no new publication required."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            remote="$(git rev-parse origin/main)"
            if [[ "$(git rev-parse HEAD)" != "$remote" ]]; then
              git reset --hard "$remote"
              node scripts/refresh-current-homework.mjs
              node --test tests/teacher-page-parsers.test.mjs tests/homework-posting.test.mjs tests/homework-feed.test.mjs
            fi
            if git diff --quiet -- pages/data/homework-current.json; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add pages/data/homework-current.json
            git commit -m "Refresh independently verified ABVM homework"
            if git push origin HEAD:main 2>"$RUNNER_TEMP/abvm-homework-push.log"; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A protected-branch policy rejection is not a main-branch race.
            # Preserve verified data as a reviewable PR, never bypass protection.
            if grep -Eqi 'commit_refs_rules|GH006|GH013|protected branch|repository rule' "$RUNNER_TEMP/abvm-homework-push.log"; then
              echo "::warning::Direct publication rejected by protected-main policy; preparing a guarded source PR."
              checked_day="$(date -u +%Y%m%d)"
              content_hash="$(node -p 'JSON.parse(require("fs").readFileSync("pages/data/homework-current.json","utf8")).contentHash')"
              [[ "$content_hash" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Verified Homework hash missing."; exit 1; }
              candidate_branch="abvm-homework-${checked_day}-${content_hash:0:12}"
              existing="$(gh pr list --head "$candidate_branch" --state open --json url --jq '.[0].url // empty')"
              if [[ -n "$existing" ]]; then
                echo "::notice::A source-identical protected candidate is already awaiting review: $existing"
                echo "published=false" >> "$GITHUB_OUTPUT"
                echo "publication_pending=true" >> "$GITHUB_OUTPUT"
                echo "candidate_pr=$existing" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Never force-push; a repeated source check must not overwrite an
              # independently reviewed candidate with fresher unreviewed bytes.
              if git ls-remote --exit-code --heads origin "$candidate_branch" >/dev/null 2>&1; then
                echo "::error::Existing candidate branch has no open PR. Reconcile it before retrying; no destructive update."
                exit 1
              fi
              git push origin "HEAD:refs/heads/$candidate_branch" || {
                echo "::error::Cannot stage verified Homework on an ordinary branch."
                exit 1
              }
              candidate_pr="$(gh pr create --base main --head "$candidate_branch" \
                --title "ABVM Homework: publish verified source update ($checked_day)" \
                --body "Source-verified Grade 2 Homework update. Official Homework content hash: $content_hash. Candidate is not a production release. Merge only after exact-head app/source checks and protected review; Pages must verify the new live data independently. No student-identifying data.")" || {
                echo "::error::Verified candidate branch staged but protected PR could not be created."
                exit 1
              }
              echo "::notice::Verified update staged for protected review: $candidate_pr"
              # PRs opened with GITHUB_TOKEN can require workflow approval; dispatch
              # full, exact-ref test-only QA without bypassing protected merge.
              gh workflow run qa.yml --ref "$candidate_branch" || { echo "::error::App QA dispatch failed; PR held."; exit 1; }
              gh workflow run qa-reproduction.yml --ref "$candidate_branch" || { echo "::error::Independent QA dispatch failed; PR held."; exit 1; }
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "publication_pending=true" >> "$GITHUB_OUTPUT"
              echo "candidate_pr=$candidate_pr" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/abvm-homework-push.log" >&2
            echo "Main advanced or push failed outside the protected-branch policy; retrying verified source."
          done
          echo "Could not publish verified Homework data." >&2
          exit 1

  deploy:
    name: Verify and deploy independently refreshed Homework
    needs: homework
    if: needs.homework.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.homework.outputs.release_sha }}
      reconcile_latest_main: true
