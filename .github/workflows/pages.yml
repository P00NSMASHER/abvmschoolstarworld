name: Deploy ABVM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        type: string
        default: main
      reconcile_latest_main:
        description: Revalidate latest main after a trusted source writer waited in the shared queue
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize publications rather than canceling an active release when a
# teacher-page refresh lands while post-deployment verification is running.
concurrency:
  group: "pages"
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    # One mutation/publication at a time; job scope avoids parent-child deadlock.
    concurrency:
      group: abvm-verified-school-state
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Only the current protected-main commit may publish. Caller-supplied
      # refs must be immutable SHAs; no branch/tag/PR may select site content.
      - name: Admit exact current protected-main commit
        id: admit
        shell: bash
        env:
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
          REQUESTED_REF: ${{ inputs.ref || '' }}
          RECONCILE_LATEST_MAIN: ${{ inputs.reconcile_latest_main || false }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_REF" != 'refs/heads/main' ]]; then
            echo "::error::Pages publication requires a main-branch trigger/caller."
            exit 1
          fi
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not verify protected-main HEAD."
            exit 1
          }
          case "$REQUESTED_REF" in
            ''|main) candidate="$TRIGGER_SHA" ;;
            *) candidate="$REQUESTED_REF" ;;
          esac
          # Queue wait can legitimately supersede a source writer's commit.
          # Only these main-branch source workflows may request reconciliation.
          # The selected immutable current-main SHA still receives full release QA.
          if [[ "${RECONCILE_LATEST_MAIN:-false}" == true ]]; then
            case "${CALLER_WORKFLOW:-}" in
              'Refresh ABVM teacher pages'|'Refresh current ABVM homework'|'Integrate ABVM uploaded notices'|'Import ABVM Yahoo weekly reminders') ;;
              *) echo '::error::Untrusted caller cannot reconcile release source.' >&2; exit 1 ;;
            esac
            [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Reconciliation needs the verified source SHA.' >&2; exit 1; }
            candidate="$current_main"
            echo '::notice::Revalidating current main after the coordinated source queue.'
          elif [[ "${CALLER_WORKFLOW:-}" == 'Deploy ABVM to GitHub Pages' && ( "${TRIGGER_EVENT:-}" == push || "${TRIGGER_EVENT:-}" == workflow_dispatch ) && ( "$REQUESTED_REF" == '' || "$REQUESTED_REF" == main ) ]]; then
            # An unpinned main release chooses main when its queue turn starts.
            # Explicit SHA/tag/branch requests keep the strict rejection below.
            candidate="$current_main"
          fi
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ || "$candidate" != "$current_main" ]]; then
            echo "::error::Requested release is not the exact current protected-main commit."
            exit 1
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Checkout admitted release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.admit.outputs.sha }}

      - name: Verify checked-out source identity
        shell: bash
        env:
          ADMITTED_SHA: ${{ steps.admit.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install QA dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache version-pinned Playwright browsers
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: abvm-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and WebKit
        run: bash scripts/install-playwright-ci.sh

      - name: Run release QA
        run: npm run qa

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R pages/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Recheck protected-main before publishing
        shell: bash
        env:
          ADMITTED_SHA: ${{ steps.admit.outputs.sha }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" != "$ADMITTED_SHA" ]]; then
            echo "::error::Main advanced while QA ran; do not publish a stale release."
            exit 1
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify live lunch data and visible mobile flows
        run: node scripts/verify-live-lunch.mjs

      - name: Retain exact live publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-live-lunch-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-lunch-proof
          retention-days: 14
          if-no-files-found: ignore
