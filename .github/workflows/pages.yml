name: Deploy ABVM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/sync-study-pack.yml'
      - '.github/workflows/refresh-health.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install QA dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release QA
        run: npm run qa

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R pages/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify live lunch data and visible mobile flows
        run: node scripts/verify-live-lunch.mjs

      - name: Retain exact live publication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-live-lunch-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-lunch-proof
          retention-days: 14
          if-no-files-found: ignore
