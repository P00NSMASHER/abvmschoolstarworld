name: Install premium calendar photo sprites

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-calendar-sprites.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download premium calendar sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages/assets/calendar
          curl -L --fail --retry 3 --retry-delay 2 "https://at.adobe.com/e0O2ko9PJF0PIefk" -o pages/assets/calendar/photo-sprite-1.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://at.adobe.com/YvE1lSFu0oAUzmgO" -o pages/assets/calendar/photo-sprite-2.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://at.adobe.com/V2ywoJiB1Rrn0bHM" -o pages/assets/calendar/photo-sprite-3.jpg
          curl -L --fail --retry 3 --retry-delay 2 "https://at.adobe.com/EjEWyflwZLJEdA8n" -o pages/assets/calendar/photo-sprite-4.jpg

          for f in pages/assets/calendar/photo-sprite-*.jpg; do
            test -s "$f"
            file "$f" | grep -qiE 'JPEG image data|image'
          done

      - name: Commit premium calendar sprites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/assets/calendar/photo-sprite-1.jpg pages/assets/calendar/photo-sprite-2.jpg pages/assets/calendar/photo-sprite-3.jpg pages/assets/calendar/photo-sprite-4.jpg
          if git diff --cached --quiet; then
            echo "No sprite changes to commit."
            exit 0
          fi
          git commit -m "Add 38-asset premium calendar photo sprites"
          git push origin HEAD:main
