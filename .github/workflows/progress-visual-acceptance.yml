name: Progress premium visual acceptance

on:
  pull_request:
    paths:
      - 'pages/design-polish.css'
      - 'pages/product-view.js'
      - 'pages/index.html'
      - 'pages/sw.js'
      - 'tests/progress-premium.spec.mjs'
      - 'tests/integrated-premium.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/progress-visual-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-progress-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progress-render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble-amd64@sha256:1e639776ab90f116a8c3c4a68b959a9f62d396590e3b8d5933573763b8cfe093
      options: --ipc=host
    env:
      ABVM_PREINSTALLED_BROWSERS: '1'
    defaults:
      run:
        shell: bash
    timeout-minutes: 16
    steps:
      - name: Set up Python for local app server and parser checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact review-head commit
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:runtime
      - name: Cache version-pinned Playwright browsers
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: abvm-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and WebKit with bounded dependency fallback
        run: bash scripts/install-playwright-ci.sh
      - name: Test Progress render and true learning state in Chromium and WebKit
        run: npx playwright test tests/progress-premium.spec.mjs tests/integrated-premium.spec.mjs --project=mobile --project=iphone-webkit --workers=1 --retries=0
      - name: Retain real rendered screenshots, traces and accessibility receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-progress-visual-${{ github.run_id }}
          path: |
            test-results/**/progress-premium-*.png
            test-results/**/integrated-premium-*.png
            test-results/**/test-failed*.png
            test-results/**/trace.zip
            playwright-report
          retention-days: 14
          if-no-files-found: ignore
