name: Roll forward ABVM reviewed lunch week

# Independent of teacher curriculum QA: a held lesson must never strand this
# week's already-reviewed meals behind last week's publication.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-reviewed-lunch-week.yml'
      - 'scripts/refresh-reviewed-lunch.mjs'
      - 'scripts/lunch-publication.mjs'
      - 'pages/data/lunch-catalog.json'
  schedule:
    # Roll over near the start of Monday, before the morning family check.
    # Daily no-change checks are cheap; Monday has a separate missed-cron backup.
    - cron: '11 0 * * *'
      timezone: 'America/New_York'
    - cron: '37 5 * * 1'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-reviewed-lunch-week
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    name: Validate and publish only reviewed lunch-week data
    concurrency:
      group: abvm-verified-school-state
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble-amd64
      options: --ipc=host
    env:
      ABVM_PREINSTALLED_BROWSERS: '1'
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    outputs:
      published: ${{ steps.commit.outputs.published }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Trust only the mounted Actions workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate existing reviewed lunch logic before mutation
        run: node --test tests/lunch-publication.test.mjs tests/refresh-reviewed-lunch.test.mjs
      - name: Prepare this week's reviewed lunch without changing teacher data
        run: node scripts/refresh-reviewed-lunch.mjs --write
      - name: Prove weekly data, content hash and isolation invariants
        run: node --test tests/lunch-publication.test.mjs tests/refresh-reviewed-lunch.test.mjs
      - name: Detect meaningful reviewed lunch changes
        id: change
        shell: bash
        run: |
          if git diff --quiet -- pages/data/study-pack.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Already current; no unnecessary full QA or publication.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run complete app release QA for a changed lunch week
        if: steps.change.outputs.changed == 'true'
        run: |
          bash scripts/install-playwright-ci.sh
          npm run qa
      - name: Commit only a verified lunch update against current main
        id: commit
        if: steps.change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            remote="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$(git rev-parse HEAD)" != "$remote" ]]; then
              echo 'Main advanced; rechecking reviewed sources and re-running full QA.'
              git reset --hard "$remote"
              node scripts/refresh-reviewed-lunch.mjs --write
              node --test tests/lunch-publication.test.mjs tests/refresh-reviewed-lunch.test.mjs
              if ! git diff --quiet -- pages/data/study-pack.json; then npm run qa; fi
            fi
            if git diff --quiet -- pages/data/study-pack.json; then
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add pages/data/study-pack.json
            git commit -m 'data: roll forward source-reviewed ABVM lunch week'
            if git push origin HEAD:main; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
              echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Main moved during lunch publication attempt $attempt; retrying from verified main."
          done
          echo 'Reviewed lunch could not be published after three exact-main attempts.' >&2
          exit 1
      - name: Preserve failed QA evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-lunch-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Release published reviewed lunches through guarded Pages
    needs: refresh
    if: needs.refresh.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.release_sha }}
      reconcile_latest_main: true
