name: ABVM App QA

on:
  pull_request:
    paths:
      - 'pages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'curriculum-candidates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - '.github/workflows/qa.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/sync-study-pack.yml'
      - '.github/workflows/refresh-health.yml'
      - '.github/workflows/health-dashboard.yml'
  push:
    branches: [main]
    # Pages runs release QA for live-site changes. Keep non-deployable tooling and
    # governance changes in this exact-main QA lane without publishing the site.
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'curriculum-candidates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - '.github/workflows/qa.yml'
      - '.github/workflows/sync-study-pack.yml'
      - '.github/workflows/refresh-health.yml'
      - '.github/workflows/health-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static validation
        run: npm run qa:static

      - name: Unit and lunch-source failure-path tests
        run: npm run qa:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, responsive, and accessibility QA
        run: npm run qa:e2e

      - name: Verify publication checker against candidate app
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory pages >/tmp/abvm-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ABVM_LIVE_URL=http://127.0.0.1:4173/ node scripts/verify-live-lunch.mjs

      - name: Retain candidate verification receipt and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-qa-${{ github.run_id }}
          path: |
            live-lunch-proof
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
