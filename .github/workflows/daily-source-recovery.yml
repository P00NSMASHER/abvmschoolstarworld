name: ABVM daily source self-recovery

# Neither teacher/educator permission nor an owner signoff is needed to
# refresh already verified private companion-app school information.
# Integrity, source attribution and release QA still gate publication.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-controller.mjs'
      - 'scripts/source-freshness-recovery.mjs'
      - 'scripts/publication-parity-health.mjs'
      - 'tests/unattended-parity-health.test.mjs'
      - 'tests/refresh-controller.test.mjs'
      - 'tests/nested-publication-recovery.test.mjs'
      - 'scripts/lunch-publication.mjs'
      - 'scripts/refresh-reviewed-lunch.mjs'
      - '.github/workflows/refresh-reviewed-lunch-week.yml'
      - '.github/workflows/daily-source-recovery.yml'
  schedule:
    - cron: '11 6-23 * * *'
      timezone: 'America/New_York'
    # The last Homework poll is 11:23 PM. Recheck after its full 90-minute
    # grace window so two dropped late-evening crons cannot stay stale until
    # morning. The watchdog below provides an independent wake-up as well.
    - cron: '59 0 * * *'
      timezone: 'America/New_York'
  # Run bounded recovery after the watchdog, including a failed watchdog.
  # GitHub cron may run late or be dropped, so it cannot be the sole trigger.
  workflow_run:
    workflows:
      - Monitor ABVM refresh health
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: abvm-daily-source-self-recovery
  cancel-in-progress: false

jobs:
  check-and-recover:
    # Only the original repository's main watchdog may trigger write actions.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prove decisions preserve verified source identity and date
        run: node --test tests/source-freshness-recovery.test.mjs tests/refresh-controller.test.mjs tests/recovery-history-integrity.test.mjs tests/nested-publication-recovery.test.mjs

      - name: Inspect source freshness and published-site parity
        run: node scripts/source-freshness-recovery.mjs --report=source-recovery-plan.json

      - name: Recover stale sources or mismatched publication without manual approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan=source-recovery-plan.json
          jq -e . "$plan" >/dev/null
          if jq -e '.caution | length > 0' "$plan" >/dev/null; then
            echo "::warning::Live-file verification incomplete; never invent a successful deployment."
          fi

          maybe_dispatch() {
            local workflow="$1" needed="$2"
            if [[ "$needed" != true ]]; then
              echo "Already current: $workflow"
              return 0
            fi
            local recent running count today attempts
            # This function is called in an OR-list; Bash errexit alone does
            # not stop failed reads inside it. Never guess an empty history.
            if ! recent="$(gh run list --workflow "$workflow" --branch main --limit 70 --json status,event,createdAt,updatedAt,conclusion)"; then
              echo "::error::Cannot verify workflow history for $workflow; no recovery dispatched."
              return 1
            fi
            if ! jq -e 'type == "array" and all(.[];
              (.status | IN("completed", "in_progress", "queued", "pending", "waiting", "requested")) and
              ((.event | type) == "string") and ((.createdAt | type) == "string") and
              has("conclusion"))' <<< "$recent" >/dev/null; then
              echo "::error::Invalid workflow history for $workflow; no recovery dispatched."
              return 1
            fi
            running="$(jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length' <<< "$recent")" || return 1
            if (( running > 0 )); then
              local stalled
              # Do not silently report recovery as healthy when GitHub has
              # left an active/queued main workflow without progress for 2h.
              stalled="$(jq -r --argjson cutoff "$(($(date -u +%s) - 7200))" '[.[] | select(.status != "completed") | select(((.updatedAt // .createdAt) | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff)] | length' <<< "$recent")" || return 1
              if (( stalled > 0 )); then
                echo "::error::Detected stalled active workflow: $workflow; $stalled run(s) older than 2 hours. Keep source/release gates intact and report the incident."
                return 1
              fi
              echo "Recovery already in progress: $workflow"
              return 0
            fi
            if [[ "$workflow" == pages.yml ]]; then
              # Reusable Pages jobs belong to their source workflow in run
              # history. A standalone-only query misses those active publishers.
              local publisher publisher_history
              for publisher in sync-study-pack.yml refresh-current-homework.yml refresh-reviewed-lunch-week.yml sync-uploaded-notices.yml import-yahoo-weekly-reminders.yml; do
                if ! publisher_history="$(gh run list --workflow "$publisher" --branch main --limit 70 --json status,event,createdAt,updatedAt,conclusion)"; then
                  echo "::error::Cannot verify nested publisher history for $publisher; no recovery dispatched."
                  return 1
                fi
                if ! jq -e 'type == "array" and all(.[];
                  (.status | IN("completed", "in_progress", "queued", "pending", "waiting", "requested")) and
                  ((.event | type) == "string") and ((.createdAt | type) == "string") and
                  has("conclusion"))' <<< "$publisher_history" >/dev/null; then
                  echo "::error::Invalid nested publisher history for $publisher; no recovery dispatched."
                  return 1
                fi
                running="$(jq '[.[] | select(.status != "completed")] | length' <<< "$publisher_history")" || return 1
                if (( running > 0 )); then
                  local stalled_publisher
                  # A queued nested publisher may legitimately need a full QA
                  # window, but two hours with no completion is material.
                  stalled_publisher="$(jq -r --argjson cutoff "$(($(date -u +%s) - 7200))" '[.[] | select(.status != "completed") | select(((.updatedAt // .createdAt) | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff)] | length' <<< "$publisher_history")" || return 1
                  if (( stalled_publisher > 0 )); then
                    echo "::error::Detected stalled source publisher: $publisher ($stalled_publisher run(s) older than 2 hours); release still unverified."
                    return 1
                  fi
                  echo "Source/publication already in progress: $publisher; defer standalone Pages recovery."
                  return 0
                fi
              done
            fi
            today="$(date -u +%Y-%m-%d)" || return 1
            count="$(jq -r --arg day "$today" '[.[] | select(.event == "workflow_dispatch" and .status == "completed" and .conclusion != "success" and (.createdAt | startswith($day)))] | length' <<< "$recent")" || return 1
            if (( count >= 2 )); then
              echo "::error::Daily failed-recovery budget reached for $workflow; data remains stale. Do not bypass verification."
              return 1
            fi
            # A successful dispatch with persistently stale source evidence
            # can otherwise create an unbounded watchdog/recovery feedback loop.
            attempts="$(jq -r --arg day "$today" '[.[] | select(.event == "workflow_dispatch" and (.createdAt | startswith($day)))] | length' <<< "$recent")" || return 1
            if (( attempts >= 6 )); then
              echo "::error::Daily recovery dispatch cap reached for $workflow; hold stale source and surface the incident."
              return 1
            fi
            echo "Dispatching verified-source recovery: $workflow (failed-attempt budget $((count+1))/2 UTC day)"
            gh workflow run "$workflow" --ref main
          }

          curriculum="$(jq -er '.refreshCurriculum | if type == "boolean" then tostring else error("invalid curriculum verdict") end' "$plan")"
          homework="$(jq -er '.refreshHomework | if type == "boolean" then tostring else error("invalid Homework verdict") end' "$plan")"
          lunch="$(jq -er '.refreshReviewedLunch | if type == "boolean" then tostring else error("invalid lunch verdict") end' "$plan")"
          deploy="$(jq -er '.redeploy | if type == "boolean" then tostring else error("invalid publication verdict") end' "$plan")"
          result=0
          maybe_dispatch refresh-reviewed-lunch-week.yml "$lunch" || result=1
          maybe_dispatch sync-study-pack.yml "$curriculum" || result=1
          maybe_dispatch refresh-current-homework.yml "$homework" || result=1
          # Pages may be re-dispatched ONLY if every repository source lane is current.
          # Its independent exact-main SHA and full QA safeguards remain active.
          if [[ "$curriculum" == false && "$homework" == false && "$lunch" == false ]]; then
            maybe_dispatch pages.yml "$deploy" || result=1
          fi
          exit "$result"

      - name: Retain machine-readable daily source verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abvm-daily-source-recovery-${{ github.run_id }}
          path: source-recovery-plan.json
          retention-days: 30
          if-no-files-found: ignore
