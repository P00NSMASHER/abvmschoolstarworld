name: Today premium visual acceptance

on:
  pull_request:
    paths:
      - 'pages/data/lunch-art-registry.json'
      - 'pages/data/lunch-art-current.json'
      - 'pages/lunch-art.js'
      - 'pages/assets/lunch-art/**'
      - 'scripts/build-lunch-art-plan.mjs'
      - 'scripts/lunch-art-style.mjs'
      - 'pages/design-polish.css'
      - 'pages/styles.css'
      - 'pages/index.html'
      - 'pages/product-view.js'
      - 'pages/sw.js'
      - 'pages/app.js'
      - 'pages/school-updates.js'
      - 'tests/teacher-source-fallback.spec.mjs'
      - 'tests/today-premium.spec.mjs'
      - 'tests/today-assessments.spec.mjs'
      - 'tests/weekly-learning-dashboard.spec.mjs'
      - 'tests/tablet-desktop.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/today-visual-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-today-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-today:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble-amd64@sha256:1e639776ab90f116a8c3c4a68b959a9f62d396590e3b8d5933573763b8cfe093
      options: --ipc=host
    env:
      ABVM_PREINSTALLED_BROWSERS: '1'
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - name: Set up Python for local app server and parser checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact review-head commit
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:runtime
      - name: Cache version-pinned Playwright browsers
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: abvm-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and WebKit with bounded dependency fallback
        run: bash scripts/install-playwright-ci.sh
      - name: Real iPhone-width Chromium and Safari-WebKit visual acceptance
        run: npx playwright test tests/today-premium.spec.mjs tests/today-assessments.spec.mjs tests/lunch-trays.spec.mjs tests/teacher-source-fallback.spec.mjs --project=mobile --project=iphone-webkit --workers=1 --retries=0
      - name: Preserve phone visual evidence before subsequent Playwright runs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test-results ]; then mv test-results test-results-today; fi
          if [ -d playwright-report ]; then mv playwright-report playwright-report-today; fi
          # Later test commands clean the default Playwright output directory.
          # A green visual job must actually retain both engines' screenshots.
          if [ "${{ job.status }}" = "success" ]; then
            test -d test-results-today
            today_count=$(find test-results-today -type f -name 'today-premium-*.png' | wc -l)
            teacher_count=$(find test-results-today -type f -name 'teacher-source-*.png' | wc -l)
            test "$today_count" -ge 2
            test "$teacher_count" -ge 4
          fi
      - name: iPad portrait and large-tablet hero size regression
        run: npx playwright test tests/tablet-desktop.spec.mjs --project=desktop --grep 'iPad portrait|large tablet' --workers=1 --retries=0
      - name: Verify seven-day learning evidence across Eastern midnight
        run: npx playwright test tests/weekly-learning-dashboard.spec.mjs --project=mobile --workers=1 --retries=0
      - name: Directly downloadable rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-today-visual-${{ github.run_id }}
          path: |
            test-results-today/**/today-premium-*.png
            test-results-today/**/today-assessments-*.png
            test-results-today/**/lunch-trays-*.png
            test-results-today/**/teacher-source-*.png
            playwright-report-today
            test-results-today/**/trace.zip
            test-results-today/**/test-failed-*.png
            playwright-report
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
          retention-days: 14
          if-no-files-found: ignore
