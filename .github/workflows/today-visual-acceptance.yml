name: Today premium visual acceptance

on:
  pull_request:
    paths:
      - 'pages/design-polish.css'
      - 'pages/styles.css'
      - 'pages/index.html'
      - 'pages/product-view.js'
      - 'pages/sw.js'
      - 'tests/today-premium.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/today-visual-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-today-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-today:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack:runtime
      - run: npx playwright install --with-deps chromium webkit
      - name: Real iPhone-width Chromium and Safari-WebKit visual acceptance
        run: npx playwright test tests/today-premium.spec.mjs --project=mobile --project=iphone-webkit --workers=1 --retries=0
      - name: Directly downloadable rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-today-visual-${{ github.run_id }}
          path: |
            test-results/**/today-premium-*.png
            playwright-report
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
          retention-days: 14
          if-no-files-found: ignore
