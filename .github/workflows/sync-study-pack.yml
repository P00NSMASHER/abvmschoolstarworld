name: Refresh ABVM teacher pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-teacher-pages.mjs'
      - 'scripts/grade2-content-pipeline.mjs'
      - 'scripts/grade2-coverage-autopilot.mjs'
      - 'scripts/grade2-content-alignment.mjs'
      - 'scripts/teacher-page-parsers.mjs'
      - 'scripts/lunch-publication.mjs'
      - 'pages/data/lunch-catalog.json'
      - 'scripts/validate-uploaded-notices.mjs'
      - 'tests/grade2-content-pipeline.test.mjs'
      - 'tests/grade2-coverage-autopilot.test.mjs'
      - '.github/workflows/sync-study-pack.yml'
  schedule:
    - cron: '17 6 * * *'
      timezone: 'America/New_York'
    - cron: '47 9 * * *'
      timezone: 'America/New_York'
    - cron: '17 13 * * *'
      timezone: 'America/New_York'
    - cron: '47 15 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: abvm-school-pack
  cancel-in-progress: false

jobs:
  refresh:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan and validate the public teacher pages
        run: node scripts/refresh-teacher-pages.mjs

      - name: Verify refreshed source health
        run: node scripts/check-refresh-health.mjs --require-today --max-age-hours 1

      - name: Build curriculum coverage candidate packet
        run: node scripts/grade2-coverage-autopilot.mjs --input pages/data/study-pack.json --output artifacts/grade2-coverage-candidates.json

      - name: Retain curriculum coverage candidate packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade2-coverage-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/grade2-coverage-candidates.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Chromium for candidate QA
        run: npx playwright install --with-deps chromium

      - name: Validate the candidate app before changing main
        run: npm run qa

      - name: Commit only after the candidate passed all QA
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pages/data/study-pack.json; then
            echo "No school-pack changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/data/study-pack.json
          git commit -m "Refresh verified ABVM teacher pages"
          git push

  deploy:
    name: deploy verified refresh through Pages workflow
    needs: refresh
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
