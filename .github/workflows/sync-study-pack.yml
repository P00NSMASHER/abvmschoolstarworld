name: Refresh ABVM teacher pages

on:
  schedule:
    # GitHub cron is UTC. Schedule both DST/standard-time UTC possibilities,
    # then gate to exactly 1:17 PM or 4:17 PM America/New_York below.
    - cron: '17 17,18,20,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: abvm-school-pack
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this is an active Eastern-time refresh window
        id: refresh_window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "window=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_time="$(TZ=America/New_York date +'%H:%M')"
          case "$local_time" in
            13:17) window=primary ;;
            16:17) window=backup ;;
            *) echo "proceed=false" >> "$GITHUB_OUTPUT"; echo "window=guard-skip" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "window=$window" >> "$GITHUB_OUTPUT"
          echo "Running $window refresh at $local_time America/New_York."

      - uses: actions/checkout@v6
        if: steps.refresh_window.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.refresh_window.outputs.proceed == 'true'
        with:
          node-version: 22

      - name: Scan and validate the public teacher pages
        if: steps.refresh_window.outputs.proceed == 'true'
        run: node scripts/refresh-teacher-pages.mjs

      - name: Commit only when the verified pack changed
        if: steps.refresh_window.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pages/data/study-pack.json; then
            echo "No school-pack changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages/data/study-pack.json
            git commit -m "Refresh verified ABVM teacher pages"
            git push
          fi

      - name: Install QA dependencies
        if: steps.refresh_window.outputs.proceed == 'true'
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        if: steps.refresh_window.outputs.proceed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate refreshed app before deployment
        if: steps.refresh_window.outputs.proceed == 'true'
        run: npm run qa

      - name: Build static site
        if: steps.refresh_window.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R pages/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        if: steps.refresh_window.outputs.proceed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: steps.refresh_window.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        if: steps.refresh_window.outputs.proceed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
