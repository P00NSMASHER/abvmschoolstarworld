name: Refresh ABVM teacher pages

on:
  schedule:
    - cron: '0 13 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: abvm-school-pack
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan and validate the public teacher pages
        run: node scripts/refresh-teacher-pages.mjs

      - name: Commit only when the verified pack changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pages/data/study-pack.json; then
            echo "No school-pack changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages/data/study-pack.json
            git commit -m "Refresh verified ABVM teacher pages"
            git push
          fi

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R pages/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
