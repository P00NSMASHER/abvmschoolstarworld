name: Diagnose ABVM lunch source
on:
  push:
    branches: [fix/current-week-lunch-source]
    paths: ['.github/workflows/lunch-source-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public source evidence and probe bridge
        shell: bash
        run: |
          mkdir -p /tmp/abvm-lunch-evidence
          python3 - <<'PY'
          import urllib.request, json, hashlib, pathlib, concurrent.futures
          root=pathlib.Path('/tmp/abvm-lunch-evidence')
          urls={
            'school.html':'https://www.assumptionbvmschool.net/parent-resources',
            'school-menu.pdf':'https://resources.finalsite.net/images/v1787165302/adeducatorsorg/gvzkkrduwn7fce9l3vsw/AugustandSeptlunch26.pdf',
            'bridge-health.json':'https://abvm-source-bridge-gkj08k.v2.appdeploy.ai/api/_healthcheck',
            'bridge-lunch.json':'https://abvm-source-bridge-gkj08k.v2.appdeploy.ai/api/lunch-menu',
            'live-pack.json':'https://p00nsmasher.github.io/abvmschoolstarworld/data/study-pack.json'
          }
          def fetch(pair):
            name,url=pair
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ABVM-Lunch-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=55) as response:
                body=response.read(12_000_000)
                (root/name).write_bytes(body)
                result={'file':name,'url':url,'finalUrl':response.url,'status':response.status,'contentType':response.headers.get('Content-Type'),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
                if name.startswith('bridge'): result['body']=body[:16000].decode('utf-8','replace')
                return result
            except Exception as err: return {'file':name,'url':url,'error':str(err)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: results=list(pool.map(fetch,urls.items()))
          (root/'diagnostic.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
          if command -v pdftotext >/dev/null && [ -f /tmp/abvm-lunch-evidence/school-menu.pdf ]; then
            pdftotext -layout /tmp/abvm-lunch-evidence/school-menu.pdf /tmp/abvm-lunch-evidence/school-menu.txt
            cat /tmp/abvm-lunch-evidence/school-menu.txt
          fi
          git archive --format=tar HEAD | gzip > /tmp/abvm-lunch-evidence/repo.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: abvm-lunch-source-diagnostic
          path: /tmp/abvm-lunch-evidence
          retention-days: 7
