name: Monitor ABVM refresh health

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-refresh-health.mjs'
      - 'scripts/publication-parity-health.mjs'
      - 'tests/unattended-parity-health.test.mjs'
      - 'scripts/homework-live-monitor.mjs'
      - 'tests/homework-live-monitor.test.mjs'
      - '.github/workflows/refresh-health.yml'
  workflow_run:
    workflows:
      - Deploy ABVM to GitHub Pages
      - Refresh ABVM teacher pages
      - Refresh current ABVM homework
    types: [completed]
  schedule:
    # GitHub may delay individual scheduled jobs; this hourly independent
    # heartbeat supplements source-workflow completion and bounded recovery.
    - cron: '29 6-23 * * *'
      timezone: 'America/New_York'
    - cron: '29 2 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-refresh-health
  cancel-in-progress: true

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    name: verify current teacher data
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository and deployed school pack are current
        run: node scripts/check-refresh-health.mjs --max-age-hours 16 --live-url https://p00nsmasher.github.io/abvmschoolstarworld/data/study-pack.json --wait-seconds 180
