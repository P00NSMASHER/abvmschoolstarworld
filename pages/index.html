<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fbff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ABVM Grade 2">
  <meta name="description" content="ABVM Grade 2 planner, calendar, study guide, study games, and family dashboard.">
  <title>ABVM Grade 2</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/abvm-app-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/abvm-app-icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=73">
</head>
<body>
  <main class="site-shell">
    <section class="phone-app" aria-label="ABVM Grade 2 weekly planner">
      <a class="skip-link" href="#app-content">Skip to content</a>
      <div class="screen-stack" id="app-content" aria-live="polite" aria-atomic="false"></div>

      <nav class="bottom-nav" aria-label="App navigation">
        <button class="active" data-tab="today" aria-current="page" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg>
          </span><b>Today</b>
        </button>
        <button data-tab="week" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/><path d="M8 13h2M12 13h2M16 13h1M8 17h2M12 17h2M16 17h1"/></svg>
          </span><b>Week</b>
        </button>
        <button data-tab="calendar" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="16" rx="2"/><path d="M8 2.5v4M16 2.5v4M4 9h16"/><path d="M8 13h8M8 16.5h5"/></svg>
          </span><b>Calendar</b>
        </button>
        <button data-tab="study" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 20 3.4-.8L19 7.6 16.4 5 4.8 16.6 4 20Z"/><path d="m14.8 6.6 2.6 2.6M12 20h8"/></svg>
          </span><b>Study</b>
        </button>
        <button data-tab="games" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7.5 8h9c2.9 0 5 2.4 5 5.5S20.2 19 18 19c-1.4 0-2.5-1.1-3.5-2.5h-5C8.5 17.9 7.4 19 6 19c-2.2 0-3.5-2.4-3.5-5.5S4.6 8 7.5 8Z"/><path d="M7 11v5M4.5 13.5h5M16.5 12h.1M19 14.5h.1"/></svg>
          </span><b>Study<br>Games</b>
        </button>
        <button data-tab="family" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 20c.4-4.2 2.4-6.3 5.5-6.3s5.1 2.1 5.5 6.3"/><path d="M14.2 14.4c.8-.5 1.7-.7 2.8-.7 2.7 0 4.2 1.8 4.5 5.3"/></svg>
          </span><b>Family</b>
        </button>
      </nav>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      if (!("serviceWorker" in navigator)) return;
      const reloadKey = "abvm-sw-reloaded-v75";
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) return;
        try {
          if (sessionStorage.getItem(reloadKey) === "1") return;
          sessionStorage.setItem(reloadKey, "1");
        } catch {}
        location.reload();
      });
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
        .then(registration => registration.update())
        .catch(() => {});
    })();
  </script>
  <script src="./app.js?v=75"></script>
</body>
</html>
