<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <meta name="description" content="ABVM Grade 2 weekly planner">
  <title>ABVM Grade 2 Week</title>
  <link rel="icon" href="https://abvm-grade2-week.amuricaaa.chatgpt.site/icon-192.png">
  <link rel="apple-touch-icon" href="https://abvm-grade2-week.amuricaaa.chatgpt.site/apple-touch-icon.png">
  <link rel="stylesheet" href="./original-host.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="site-shell">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <section class="phone-app" aria-label="ABVM Grade 2 weekly planner">
      <a class="skip-link" href="#app-content">Skip to content</a>
      <div class="screen-stack" id="app-content"></div>
      <nav class="bottom-nav" aria-label="App navigation">
        <button class="active" data-tab="today" aria-current="page"><span>★</span><b>Today</b></button>
        <button data-tab="week"><span>▦</span><b>Week</b></button>
        <button data-tab="calendar"><span>▣</span><b>Calendar</b></button>
        <button data-tab="study"><span>✎</span><b>Study</b></button>
        <button data-tab="family"><span>⌂</span><b>Family</b></button>
      </nav>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
