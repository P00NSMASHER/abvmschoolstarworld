<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ABVM Grade 2">
  <meta name="description" content="ABVM Grade 2 parent companion for current school information, homework, study guides, dates, and family reminders.">
  <title>ABVM Grade 2 Parent Companion</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/abvm-app-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/abvm-app-icon-180.png">
  <link rel="preload" href="./assets/hero-today.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="./design-tokens.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="site-shell">
    <section class="phone-app" aria-label="ABVM Grade 2 weekly planner">
      <a class="skip-link" href="#app-content">Skip to content</a>
      <div class="screen-stack" id="app-content" aria-live="polite">
        <div class="screen loading-screen" role="status" aria-label="Loading current school information">
          <section class="top-scene loading-hero"><div class="loading-brand"></div><div class="loading-title"></div></section>
          <div class="content loading-content"><div class="loading-card"></div><div class="loading-card short"></div></div>
          <span class="sr-only">Loading current ABVM Grade 2 school information.</span>
        </div>
      </div>

      <nav class="bottom-nav" aria-label="App navigation">
        <button class="active" data-tab="today" aria-current="page" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg>
          </span><b>Today</b>
        </button>
        <button data-tab="week" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/><path d="M8 13h2M12 13h2M16 13h1M8 17h2M12 17h2M16 17h1"/></svg>
          </span><b>Week</b>
        </button>
        <button data-tab="calendar" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="16" rx="2"/><path d="M8 2.5v4M16 2.5v4M4 9h16"/><path d="M8 13h8M8 16.5h5"/></svg>
          </span><b>Calendar</b>
        </button>
        <button data-tab="study" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 20 3.4-.8L19 7.6 16.4 5 4.8 16.6 4 20Z"/><path d="m14.8 6.6 2.6 2.6M12 20h8"/></svg>
          </span><b>Study</b>
        </button>
        <button data-tab="family" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 20c.4-4.2 2.4-6.3 5.5-6.3s5.1 2.1 5.5 6.3"/><path d="M14.2 14.4c.8-.5 1.7-.7 2.8-.7 2.7 0 4.2 1.8 4.5 5.3"/></svg>
          </span><b>Family</b>
        </button>
      </nav>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
