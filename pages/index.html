<body>
  <main class="site-shell">
    <section class="phone-app" aria-label="ABVM Grade 2 weekly planner">
      <a class="skip-link" href="#app-content">Skip to content</a>
      <div class="screen-stack" id="app-content"></div>

      <nav class="bottom-nav" aria-label="App navigation">
        <button class="active" data-tab="today" aria-current="page" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg>
          </span><b>Today</b>
        </button>
        <button data-tab="calendar" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/><path d="M8 13h2M12 13h2M16 13h1M8 17h2M12 17h2M16 17h1"/></svg>
          </span><b>Calendar</b>
        </button>
        <button data-tab="study" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 20 3.4-.8L19 7.6 16.4 5 4.8 16.6 4 20Z"/><path d="m14.8 6.6 2.6 2.6M12 20h8"/></svg>
          </span><b>Study</b>
        </button>
        <button data-tab="family" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19h16M7 15v-4m5 4V5m5 10V9"/></svg>
          </span><b>Progress</b>
        </button>
      </nav>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      if (!("serviceWorker" in navigator)) return;
      const reloadKey = "abvm-sw-reloaded-v138";
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) return;
        try {
          if (sessionStorage.getItem(reloadKey) === "1") return;
          sessionStorage.setItem(reloadKey, "1");
        } catch {}
        location.reload();
      });
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
        .then(registration => registration.update())
        .catch(() => {});
    })();
  </script>
  <script src="./school-updates.js?v=3"></script>
  <script src="./weekly-learning.js?v=6"></script>
  <script src="./study-support.js?v=3"></script>
  <script src="./lunch-art.js?v=1"></script>
  <script src="./product-view.js?v=3"></script>
  <script src="./app.js?v=130"></script>
</body>
</html>
