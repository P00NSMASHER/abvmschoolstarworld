m11","kind":"text","prompt":"Subtract: <b>65 − 20</b> =","answers":["45"],"why":"Take away two tens from 65 to get 45."},{"id":"m12","kind":"vertical","prompt":"Add. Show your answer.","top":"34","bottom":"+ 23","answers":["57"],"why":"4 + 3 = 7 ones, and 3 + 2 = 5 tens: 57."},{"id":"m13","kind":"text","prompt":"Subtract: <b>17 − 8</b> =","answers":["9"],"why":"17 minus 8 is 9."},{"id":"m14","kind":"text","prompt":"Add: <b>8 + 7</b> =","answers":["15"],"why":"8 + 7 = 15."},{"id":"m15","kind":"text","prompt":"There are <b>15 shells</b>. Six shells are white. How many shells are <b>NOT white</b>?","answers":["9"],"why":"Find the shells that are not white: 15 − 6 = 9."},{"id":"m16","kind":"text","prompt":"A class has <b>10 apples</b>. They pick <b>4 more</b>. How many apples do they have in all?","answers":["14"],"why":"The apples were added: 10 + 4 = 14."},{"id":"m17","kind":"clock","prompt":"Write the time shown on the clock.","answers":["3:30","3 30","03:30"],"why":"The minute hand points to 6 (30 minutes) and the hour hand is halfway past 3: 3:30."},{"id":"m18","kind":"text","prompt":"How many cents is <b>one quarter</b> worth?","answers":["25","25c","25¢","25 cents"],"why":"A quarter is worth 25 cents."},{"id":"m19","kind":"pair","prompt":"Write the number <b>before</b> 59 and the number <b>after</b> 59.","fields":["Before 59","After 59"],"answers":["58","60"],"why":"Counting in order gives 58, 59, 60."},{"id":"m20","kind":"text","prompt":"One dime and four pennies are worth how many cents <b>in all</b>?","answers":["14","14c","14¢","14 cents"],"why":"A dime is 10 cents and four pennies are 4 cents: 14 cents."}]},"grammar":{"title":"Compound Words","sub":"Grammar • 14 questions","date":"Thursday, Nov. 19","minutes":"12–15","directions":"Read every question. Circle one answer when choices are given. For word-building questions, write the complete compound word on the line.","questions":[{"id":"g1","kind":"choice","prompt":"Circle the compound word.","options":[["A","rainbow"],["B","raining"],["C","rainy"]],"correct":["A"],"why":"Rain + bow join to make rainbow."},{"id":"g2","kind":"choice","prompt":"Which two words make <b>toothbrush</b>?","options":[["A","tooth + wash"],["B","tooth + brush"],["C","tool + brush"]],"correct":["B"],"why":"Tooth + brush = toothbrush."},{"id":"g3","kind":"text","prompt":"Join the two words to make one compound word: <b>sun + flower</b> =","answers":["sunflower"],"why":"Sun and flower make the compound word sunflower."},{"id":"g4","kind":"choice","prompt":"Circle the word that is <b>NOT</b> a compound word.","options":[["A","cupcake"],["B","football"],["C","pencil"]],"correct":["C"],"why":"Pencil is not formed by joining two independent words; cup + cake and foot + ball are."},{"id":"g5","kind":"text","prompt":"Write the compound word: <b>snow + man</b> =","answers":["snowman"],"why":"Snow + man = snowman, written as one word."},{"id":"g6","kind":"choice","prompt":"In the sentence “We played on the playground,” which word is compound?","options":[["A","played"],["B","playground"],["C","on"]],"correct":["B"],"why":"Playground combines play and ground."},{"id":"g7","kind":"choice","prompt":"Which two words combine to make <b>bedroom</b>?","options":[["A","bed + room"],["B","bee + room"],["C","bed + broom"]],"correct":["A"],"why":"Bed + room = bedroom."},{"id":"g8","kind":"text","prompt":"Join the words: <b>butter + fly</b> =","answers":["butterfly"],"why":"Butter + fly = butterfly."},{"id":"g9","kind":"choice","prompt":"Choose the correct way to break apart <b>raincoat</b>.","options":[["A","rai + ncoat"],["B","rain + coat"],["C","rainc + oat"]],"correct":["B"],"why":"Rain and coat are each complete words."},{"id":"g10","kind":"choice","prompt":"Fill in the sentence with a compound word: “Put your lunch in your ____.”","options":[["A","lunchbox"],["B","lunching"],["C","lunchtime"]],"correct":["A"],"why":"Lunchbox is a box for lunch; lunchtime names the time for lunch and does not fit “in your”."},{"id":"g11","kind":"text","prompt":"Complete the compound word: <b>fire + ____ = firefighter</b>.","answers":["fighter"],"why":"Fire + fighter = firefighter."},{"id":"g12","kind":"choice","prompt":"Circle the compound word in this sentence: “The mailman carried letters.”","options":[["A","carried"],["B","letters"],["C","mailman"]],"correct":["C"],"why":"Mailman is made from mail and man."},{"id":"g13","kind":"text","prompt":"Join the two words: <b>star + fish</b> =","answers":["starfish"],"why":"Star + fish = starfish."},{"id":"g14","kind":"text","prompt":"Break <b>birthday</b> into its two smaller words. Write them with a plus sign.","answers":["birth+day","birth + day"],"why":"Birth + day are the two parts of birthday."}]},"spelling":{"title":"Long A: Spelling & Handwriting","sub":"Spelling • 15 dictated words","date":"Friday, Nov. 20","minutes":"10–15","directions":"Tap “Hear word” beside each number. Listen and type the word on the writing line. The iPad will say the word and use it in a sentence. Check each letter before turning in. These are original practice words, not a verified teacher list.","questions":[{"id":"s1","kind":"dictation","word":"cake","sentence":"We baked a cake for dessert.","answers":["cake"],"why":"The word is cake. Listen for its long-a spelling pattern."},{"id":"s2","kind":"dictation","word":"plane","sentence":"The plane flew over the hills.","answers":["plane"],"why":"The word is plane. Listen for its long-a spelling pattern."},{"id":"s3","kind":"dictation","word":"rain","sentence":"The rain fell from the gray clouds.","answers":["rain"],"why":"The word is rain. Listen for its long-a spelling pattern."},{"id":"s4","kind":"dictation","word":"day","sentence":"Today is a sunny day.","answers":["day"],"why":"The word is day. Listen for its long-a spelling pattern."},{"id":"s5","kind":"dictation","word":"gate","sentence":"Please close the garden gate.","answers":["gate"],"why":"The word is gate. Listen for its long-a spelling pattern."},{"id":"s6","kind":"dictation","word":"train","sentence":"The train stopped at the station.","answers":["train"],"why":"The word is train. Listen for its long-a spelling pattern."},{"id":"s7","kind":"dictation","word":"snail","sentence":"A snail moved across the path.","answers":["snail"],"why":"The word is snail. Listen for its long-a spelling pattern."},{"id":"s8","kind":"dictation","word":"play","sentence":"The friends will play at recess.","answers":["play"],"why":"The word is play. Listen for its long-a spelling pattern."},{"id":"s9","kind":"dictation","word":"name","sentence":"Write your name at the top.","answers":["name"],"why":"The word is name. Listen for its long-a spelling pattern."},{"id":"s10","kind":"dictation","word":"paint","sentence":"We will paint a picture.","answers":["paint"],"why":"The word is paint. Listen for its long-a spelling pattern."},{"id":"s11","kind":"dictation","word":"stay","sentence":"We will stay inside while it rains.","answers":["stay"],"why":"The word is stay. Listen for its long-a spelling pattern."},{"id":"s12","kind":"dictation","word":"mail","sentence":"The mail arrived this morning.","answers":["mail"],"why":"The word is mail. Listen for its long-a spelling pattern."},{"id":"s13","kind":"dictation","word":"lake","sentence":"The ducks swam in the lake.","answers":["lake"],"why":"The word is lake. Listen for its long-a spelling pattern."},{"id":"s14","kind":"dictation","word":"tray","sentence":"Carry the tray with both hands.","answers":["tray"],"why":"The word is tray. Listen for its long-a spelling pattern."},{"id":"s15","kind":"dictation","word":"shade","sentence":"We sat in the shade of a tree.","answers":["shade"],"why":"The word is shade. Listen for its long-a spelling pattern."}]}};
const STORE='abvm-grade2-classroom-practice-2026-11-v1';
let state={active:'math',answers:{math:{},grammar:{},spelling:{}},submitted:{},student:'',date:''};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s && s.answers && s.submitted)state={...state,...s,active:TESTS[s.active]?s.active:'math'};}catch(_e){}
const $=id=>document.getElementById(id), safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));$('saved').textContent='Saved on this iPad';}catch(_e){$('saved').textContent='Current session only';}}
const eq=(a,b)=>String(a??'').toLowerCase().trim().replace(/[\s,]/g,'')===String(b??'').toLowerCase().trim().replace(/[\s,]/g,'');
function isCorrect(q,v){
 if(q.kind==='choice'||q.kind==='line')return (q.correct||[]).includes(v);
 if(q.kind==='multi')return (q.correct||[]).length===(v||[]).length && q.correct.every(x=>(v||[]).includes(x));
 if(q.kind==='pair')return Array.isArray(v)&&q.answers.every((a,i)=>eq(a,v[i]));
 if(Array.isArray(q.answers))return q.answers.some(a=>eq(a,v));
 return false;
}
function completed(q,v){
 if(q.kind==='multi')return Array.isArray(v) && v.length>0;
 if(q.kind==='pair')return Array.isArray(v)&&v.every(x=>String(x??'').trim());
 return v!==undefined&&v!==null&&String(v).trim()!=='';
}
function answerLine(q,v,part=0){return `<input class="hand" data-qid="${q.id}" data-part="${part}" aria-label="Answer to question ${q.id.replace(/\D/g,'')}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${safe(q.kind==='pair'?(v?.[part]??''):(v??''))}" ${state.submitted[state.active]?'disabled':''}>`;}
function choiceList(q,v){const rows=q.options.map(([key,label])=>{
 const checked=q.kind==='multi'?(v||[]).includes(key):v===key;
 return `<label class="choice"><input type="${q.kind==='multi'?'checkbox':'radio'}" name="${q.id}" data-qid="${q.id}" value="${key}" ${checked?'checked':''} ${state.submitted[state.active]?'disabled':''}><span class="letter">${key}.</span><span>${safe(label)}</span></label>`;
 });return `<div class="choices ${q.options.length===4?'row-choices':''}">${rows.join('')}</div>`;}
function clockSvg(){return `<svg class="visualline" role="img" aria-label="Clock with minute hand at six and hour hand between three and four" viewBox="0 0 250 143" xmlns="http://www.w3.org/2000/svg"><g transform="translate(91,71)"><circle r="60" fill="white" stroke="#26313d" stroke-width="2"/><g fill="#26313d" font-family="Georgia" font-size="12" text-anchor="middle"><text x="0" y="-42">12</text><text x="44" y="4">3</text><text x="0" y="51">6</text><text x="-45" y="4">9</text></g><path d="M0 0 L0 36 M0 0 L24 9" stroke="#26313d" stroke-width="3" stroke-linecap="round"/><circle r="3.5" fill="#26313d"/></g></svg>`;}
function numlineSvg(){return `<svg class="visualline" role="img" aria-label="Number line from 60 through 70, mark 67 on the line" viewBox="0 0 260 66" xmlns="http://www.w3.org/2000/svg"><path d="M17 24 H243" stroke="#323d4c" stroke-width="2"/><g stroke="#323d4c" stroke-width="1.4">${Array.from({length:11},(_,i)=>`<path d="M${17+i*22.6} 16 v17"/>`).join('')}</g><g fill="#1f2937" font-size="12" text-anchor="middle" font-family="Arial"><text x="17" y="49">60</text><text x="130" y="49">65</text><text x="243" y="49">70</text></g><circle cx="175.2" cy="24" r="4.5" fill="#111"/></svg>`;}
function questionHtml(q,index){const v=state.answers[state.active]?.[q.id];
 let body='';
 if(q.kind==='choice'||q.kind==='multi')body=choiceList(q,v);
 else if(q.kind==='line')body=numlineSvg()+choiceList(q,v);
 else if(q.kind==='vertical')body=`<div class="vertical">${safe(q.top)}\n${safe(q.bottom)}</div>${answerLine(q,v)}`;
 else if(q.kind==='clock')body=clockSvg()+answerLine(q,v);
 else if(q.kind==='pair')body=`<div class="two-fields">${q.fields.map((field,i)=>`<label>${safe(field)}${answerLine(q,v,i)}</label>`).join('')}</div>`;
 else if(q.kind==='dictation')body=`<div class="spell-row"><button class="hear" type="button" data-speak="${q.id}" aria-label="Hear spelling word ${index+1}">▶ Hear word</button><label class="handline"><span class="sr-only">Word ${index+1}</span><input type="text" data-qid="${q.id}" value="${safe(v||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type spelling word ${index+1}" ${state.submitted[state.active]?'disabled':''}></label></div>`;
 else body=answerLine(q,v);
 const submitted=!!state.submitted[state.active];
 const feedback=submitted?`<div class="feedback ${isCorrect(q,v)?'good':'bad'}"><b>${isCorrect(q,v)?'✓ Correct':'✎ Check this one'}</b> — ${safe(q.why)}</div>`:'';
 return `<article class="problem"><p class="question"><span class="number">${index+1}.</span><span class="qtext">${q.kind==='dictation'?'Listen and write the word.':q.prompt}</span></p>${body}${feedback}</article>`;
}
function render(){
 const t=TESTS[state.active],answered=t.questions.filter(q=>completed(q,state.answers[state.active]?.[q.id])).length;
 document.querySelectorAll('.tab').forEach(tab=>{let id=tab.dataset.test;tab.setAttribute('aria-current',id===state.active?'page':'false');tab.querySelector('.done')?.remove();if(state.submitted[id])tab.insertAdjacentHTML('beforeend','<span class="done" aria-label="Completed"> ✓</span>')});
 $('progress').textContent=state.submitted[state.active]?'Submitted • review your corrections':`${answered} of ${t.questions.length} answers entered`;
 $('paper').innerHTML=`<div class="kicker"><span>Grade 2 · Original practice test</span><span>Practice Copy</span></div><h1>${safe(t.title)}</h1><p class="sub">${safe(t.sub)} · For ${safe(t.date)}</p><div class="fields"><label class="field wide">Name <input id="student" type="text" autocomplete="off" value="${safe(state.student||'')}" aria-label="Student name"></label><label class="field date">Date <input id="datefield" type="text" value="${safe(state.date||'')}" aria-label="Date"></label><label class="field score">Score <input type="text" value="${state.submitted[state.active]?score(t).count+'/'+t.questions.length:''}" readonly aria-label="Score"></label></div><div class="directions"><b>Directions:</b> ${safe(t.directions)}</div>${state.active==='spelling'?'<p class="spell-intro">Hear each word, then write it on its numbered handwriting line.</p>':''}<h2 class="section-heading">${state.active==='spelling'?'Spelling Dictation':'Answer each question.'}</h2><div class="${state.active==='spelling'?'spell-list':'grid'}">${t.questions.map((q,i)=>questionHtml(q,i)).join('')}</div>${state.active==='spelling'?'<div class="bonus"><b>Bonus (optional):</b> Make one complete sentence using a long-a word.<p>Write a sentence on your own paper or with the iPad keyboard. This is not part of the automatic score.</p><input class="hand" aria-label="Optional spelling bonus sentence" id="bonus" type="text" value="'+safe(state.answers.spelling.bonus||'')+'"></div>':''}${state.submitted[state.active]?`<div class="result"><h2>Paper marked: ${score(t).count} / ${t.questions.length}</h2><p>${score(t).count===t.questions.length?'Every scored answer is correct.':'Review the items marked “Check this one” above, then use Try again for a fresh attempt.'}</p></div>`:''}<div class="footer"><span>Independent home practice · Not an official ABVM assessment</span><span>Recommended time: ${safe(t.minutes)} minutes suggested</span></div>`;
 $('actions').innerHTML=state.submitted[state.active]?'<button class="btn primary" id="retry">Try again</button><button class="btn" id="print">Print this test</button>':'<button class="btn primary" id="submit">Turn in test</button><button class="btn" id="print">Print blank test</button><button class="btn text" id="clear">Clear answers</button>';
 document.title=t.title+' | Grade 2 Practice';persist();
}
function score(t){return {count:t.questions.filter(q=>isCorrect(q,state.answers[state.active]?.[q.id])).length};}
function say(q){if(!('speechSynthesis' in window)){alert('Audio is not supported in this browser. An adult can read the word from the parent key.');return;}try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(`Number ${q.id.slice(1)}. ${q.word}. ${q.sentence} The word is ${q.word}.`);utter.rate=.77;utter.pitch=1;utter.lang='en-US';speechSynthesis.speak(utter);}catch(_e){alert('Audio could not play. An adult can read the word aloud.');}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-test]');if(tab){state.active=tab.dataset.test;render();window.scrollTo(0,0);return;}
 const sp=e.target.closest('[data-speak]');if(sp){const q=TESTS.spelling.questions.find(x=>x.id===sp.dataset.speak);if(q)say(q);return;}
 if(e.target.closest('#submit')){const t=TESTS[state.active],blank=t.questions.filter(q=>!completed(q,state.answers[state.active]?.[q.id])).length;if(blank && !confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Turn in anyway?`))return;state.submitted[state.active]=true;render();$('paper').scrollIntoView({behavior:'smooth'});return;}
 if(e.target.closest('#retry')){if(confirm('Start a fresh attempt? This clears this test’s answers and score.')){state.submitted[state.active]=false;state.answers[state.active]={};render();}return;}
 if(e.target.closest('#clear')){if(confirm('Clear all answers on this test?')){state.answers[state.active]={};render();}return;}
 if(e.target.closest('#print')){window.print();return;}
 if(e.target.closest('#parentkey')){let t=TESTS.spelling,code=prompt('Adult check: type PARENT to view the original practice dictation words.');if(code?.toUpperCase()==='PARENT'){alert(t.questions.map((q,i)=>`${i+1}. ${q.word} — ${q.sentence}`).join('\n'));}return;}
});
document.addEventListener('input',e=>{if(e.target.id==='student'){state.student=e.target.value;persist();return;}if(e.target.id==='datefield'){state.date=e.target.value;persist();return;}
 if(e.target.id==='bonus'){state.answers.spelling.bonus=e.target.value;persist();return;}
 const id=e.target.dataset.qid;if(!id)return;const test=state.active;if(state.submitted[test])return;
 if(e.target.dataset.part!==undefined){const arr=state.answers[test][id]||['',''];arr[Number(e.target.dataset.part)]=e.target.value;state.answers[test][id]=arr;}else if(e.target.type==='text'){state.answers[test][id]=e.target.value;}persist();$('progress').textContent=`${TESTS[test].questions.filter(q=>completed(q,state.answers[test][q.id])).length} of ${TESTS[test].questions.length} answers entered`;});
document.addEventListener('change',e=>{const id=e.target.dataset.qid;if(!id)return;const test=state.active;if(state.submitted[test])return;let q=TESTS[test].questions.find(x=>x.id===id);if(!q)return;
 if(q.kind==='multi'){let a=state.answers[test][id]||[];a=e.target.checked?[...new Set([...a,e.target.value])]:a.filter(v=>v!==e.target.value);state.answers[test][id]=a;}else if(e.target.type==='radio')state.answers[test][id]=e.target.value;persist();$('progress').textContent=`${TESTS[test].questions.filter(q=>completed(q,state.answers[test][q.id])).length} of ${TESTS[test].questions.length} answers entered`;});
$('parentkey').addEventListener('click',()=>{});
render();
</script></body></html>
